# Agronomic reference data — PROVISIONAL. See sources.yaml: agronomic_provisional_v1.
#
# These thresholds drive the ranking. They are plausible values from general crop
# science, NOT verified against a citable ICAR publication. Every crop scored
# from this file is returned with its confidence capped and the provisional
# citation attached, so the uncertainty reaches the screen instead of hiding in
# a config file.
#
# Field notes:
#   ph_optimal    - inside this band the pH factor scores 1.0
#   ph_absolute   - outside this band it scores 0.0; between the two it tapers
#   temp_*        - same taper, against mean seasonal temperature in Celsius
#   rainfall_mm   - seasonal water need; the gap is what irrigation must cover
#   sowing_window - month-day; the year is resolved at request time
#   legume        - fixes nitrogen, which the rotation and nitrogen factors use
#   nitrogen_demand - low | medium | high, scored against available soil N

