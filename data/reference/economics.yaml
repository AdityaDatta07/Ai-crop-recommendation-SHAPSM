# Economic reference data — CITED.
#
# Every number here is traceable to a government publication. See sources.yaml
# for the full citation of each source key. Nothing in this file is invented.
#
# Two deliberate properties:
#  - `price_per_quintal` is the Minimum Support Price, which is a FLOOR price,
#    not a market price. It is what the farmer is guaranteed, not what they will
#    necessarily get. The UI must say so. Live mandi prices from Agmarknet
#    override this when available; this is the fallback.
#  - Crops with no MSP and no published yield carry nulls. The orchestrator turns
#    those into null economics plus a warning rather than a guess.
#
# Cost is A2+FL per quintal as published alongside MSP: all paid-out costs plus
# imputed family labour. Cost per hectare is DERIVED in apps/api economics.py as
# cost_per_quintal * yield_quintal_per_ha — the derivation is not baked in here
# so the raw sourced figures stay auditable.

