# Minimum Support Prices — CITED, for the reference tab.
#
# WHY THIS FILE EXISTS SEPARATELY FROM economics.yaml
# ---------------------------------------------------
# economics.yaml carries MSP for the 16 crops this system actually models,
# because that is what the ranker prices. The government notifies MSP for many
# more, and a farmer looking up "what is the MSP for moong" should not be told
# nothing merely because we do not rank moong.
#
# So this file lists every mandated crop from the two CCEA notifications, and
# apps/api/tests/test_msp.py fails the build if any crop present in BOTH files
# carries a different price. Two MSP figures on one website that disagree is
# exactly the failure this project keeps having to fix; a test is cheaper than
# remembering.
#
# WHAT MSP IS, AND IS NOT
# -----------------------
# It is a floor price the government undertakes to pay at procurement. It is
# NOT a market price and it is NOT a guarantee that anyone will buy: for wheat
# and paddy procurement is extensive, for most pulses and oilseeds it reaches a
# minority of growers, and outside a procurement centre the mandi price is what
# a farmer actually gets. The UI says so; see the `caveat` key.
#
# Cost is A2+FL per quintal as published alongside each MSP: all paid-out costs
# plus imputed family labour.

